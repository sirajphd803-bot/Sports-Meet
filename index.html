<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Meet GHS Trikkulam</title>
    
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- jsPDF and AutoTable CDNs for PDF Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <style>
        body {
            background-color: #f4f6f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 15px;
        }
        .container-box {
            max-width: 500px;
            margin: 0 auto;
        }
        .card-custom {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            padding: 24px;
            margin-bottom: 20px;
        }
        .form-label {
            font-weight: 700;
            color: #495057;
            font-size: 14px;
            margin-bottom: 6px;
        }
        .form-control, .form-select {
            border-radius: 8px;
            padding: 10px 12px;
            border: 1px solid #ced4da;
            font-size: 15px;
            background-color: #f8f9fa;
        }
        .btn-primary-custom {
            background-color: #0d6efd;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            padding: 12px;
            font-size: 16px;
            width: 100%;
        }
        .btn-export-custom {
            background-color: #dc3545;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            padding: 12px;
            font-size: 15px;
            width: 100%;
            color: white;
        }
        .section-title {
            color: #0b5ed7;
            font-weight: 800;
            font-size: 20px;
        }
        .filter-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

<div class="container-box">

    <!-- 1. Participant Entry Form -->
    <div class="card-custom">
        <h5 class="section-title mb-3">Annual Sports Meet 2026-27 Entry Form _ GHS Trikkulam</h5>
        <form id="registrationForm">
            <div class="mb-3">
                <label class="form-label">Student Name</label>
                <input type="text" id="studentName" class="form-control" placeholder="Enter full name" required>
            </div>

            <!-- Class & Division Selection -->
            <div class="row g-2 mb-3">
                <div class="col-6">
                    <label class="form-label">Class</label>
                    <select id="studentClass" class="form-select" required>
                        <option value="">Select</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                        <option value="10">10</option>
                    </select>
                </div>
                <div class="col-6">
                    <label class="form-label">Division</label>
                    <select id="studentDivision" class="form-select" required>
                        <option value="">Select</option>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                        <option value="D">D</option>
                        <option value="E">E</option>
                        <option value="F">F</option>
                    </select>
                </div>
            </div>

            <div class="row g-2 mb-3">
                <div class="col-6">
                    <label class="form-label">Date of Birth</label>
                    <input type="date" id="dob" class="form-control" required>
                </div>
                <div class="col-6">
                    <label class="form-label">Category (Auto)</label>
                    <input type="text" id="category" class="form-control" placeholder="Select DOB" readonly style="background-color: #e9ecef;">
                </div>
            </div>

            <div class="row g-2 mb-3">
                <div class="col-6">
                    <label class="form-label">Gender</label>
                    <select id="gender" class="form-select" required>
                        <option value="Boys">Boys</option>
                        <option value="Girls">Girls</option>
                    </select>
                </div>
                <div class="col-6">
                    <label class="form-label">House / Group</label>
                    <select id="group" class="form-select" required>
                        <option value="">Select Group</option>
                        <option value="Blue">Blue</option>
                        <option value="Green">Green</option>
                        <option value="Red">Red</option>
                        <option value="Yellow">Yellow</option>
                    </select>
                </div>
            </div>

            <div class="row g-2 mb-3">
                <div class="col-12">
                    <label class="form-label">Event 1 (Mandatory)</label>
                    <select id="event1" class="form-select" required disabled>
                        <option value="">Select Event 1</option>
                    </select>
                </div>
            </div>

            <div class="row g-2 mb-4">
                <div class="col-6">
                    <label class="form-label">Event 2 (Optional)</label>
                    <select id="event2" class="form-select" disabled>
                        <option value="">Select Event 2</option>
                    </select>
                </div>
                <div class="col-6">
                    <label class="form-label">Event 3 (Optional)</label>
                    <select id="event3" class="form-select" disabled>
                        <option value="">Select Event 3</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-primary-custom">Save Entry</button>
        </form>
    </div>

    <!-- 2. Registered Participants -->
    <div class="card-custom">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="section-title mb-0">Registered Participants</h5>
            <button id="toggleAdminBtn" class="btn btn-secondary btn-sm rounded-2 fw-semibold">Unlock Admin</button>
        </div>

        <!-- Admin Login Panel -->
        <div id="loginBox" class="text-center my-3">
            <p class="text-muted small mb-2">Enter Admin PIN to Access Registered List</p>
            <div class="input-group">
                <input type="password" id="adminPin" class="form-control text-center" placeholder="Enter PIN">
                <button class="btn btn-primary fw-bold" id="verifyPinBtn">Unlock</button>
            </div>
        </div>

        <!-- Admin Content Section -->
        <div id="adminContent" style="display: none;">
            <div class="filter-grid">
                <div>
                    <label class="form-label">Filter Category</label>
                    <select id="filterCategory" class="form-select">
                        <option value="ALL">All Categories</option>
                        <option value="UP Kiddies">UP Kiddies</option>
                        <option value="Sub Junior">Sub Junior</option>
                        <option value="Junior">Junior</option>
                    </select>
                </div>
                <div>
                    <label class="form-label">Filter Gender</label>
                    <select id="filterGender" class="form-select">
                        <option value="ALL">All Genders</option>
                        <option value="Boys">Boys</option>
                        <option value="Girls">Girls</option>
                    </select>
                </div>
            </div>

            <div class="filter-grid">
                <div>
                    <label class="form-label">Filter Group</label>
                    <select id="filterGroup" class="form-select">
                        <option value="ALL">All Groups</option>
                        <option value="Blue">Blue</option>
                        <option value="Green">Green</option>
                        <option value="Red">Red</option>
                        <option value="Yellow">Yellow</option>
                    </select>
                </div>
                <div>
                    <label class="form-label">Filter Event</label>
                    <select id="filterEvent" class="form-select">
                        <option value="ALL">All Events</option>
                    </select>
                </div>
            </div>

            <button id="exportPdfBtn" class="btn btn-export-custom mb-3 mt-2">Export Filtered List (PDF)</button>

            <div class="table-responsive">
                <table class="table table-bordered table-striped text-center align-middle mb-0" style="font-size: 13px;">
                    <thead class="table-light">
                        <tr>
                            <th>Chest No</th>
                            <th>Name</th>
                            <th>Class</th>
                            <th>Group</th>
                            <th>Category</th>
                            <th>Gender</th>
                            <th>Items</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="participantTableBody">
                        <!-- Dynamic Rows -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const ADMIN_PIN = "sm803";
    let participants = [];
    
    // Safe LocalStorage Read
    try {
        participants = JSON.parse(localStorage.getItem("sports_participants")) || [];
    } catch(e) {
        participants = [];
    }

    const eventOptions = {
        "UP Kiddies": ["50m", "100m", "Long Jump", "Shuttle Run"],
        "Sub Junior": ["100m", "200m", "400m", "Long Jump", "High Jump", "Shot Put"],
        "Junior": ["100m", "200m", "400m", "800m", "1500m", "Long Jump", "High Jump", "Shot Put", "Discus Throw"]
    };

    const dobInput = document.getElementById("dob");
    const categoryInput = document.getElementById("category");
    const event1Select = document.getElementById("event1");
    const event2Select = document.getElementById("event2");
    const event3Select = document.getElementById("event3");
    
    const filterCategory = document.getElementById("filterCategory");
    const filterGender = document.getElementById("filterGender");
    const filterGroup = document.getElementById("filterGroup");
    const filterEvent = document.getElementById("filterEvent");
    const participantTableBody = document.getElementById("participantTableBody");

    function calculateCategory() {
        const val = dobInput.value;
        if (!val) {
            categoryInput.value = "";
            return;
        }

        const year = parseInt(val.substring(0, 4), 10);
        if (isNaN(year)) return;

        let age = 2026 - year;

        let category = "";
        if (age <= 10) {
            category = "UP Kiddies";
        } else if (age <= 13) {
            category = "Sub Junior";
        } else {
            category = "Junior";
        }

        categoryInput.value = category;
        populateEventDropdowns(category);
    }

    // Direct event bindings for high compatibility
    if (dobInput) {
        dobInput.addEventListener("change", calculateCategory);
        dobInput.addEventListener("input", calculateCategory);
        dobInput.addEventListener("blur", calculateCategory);
    }

    function populateEventDropdowns(category) {
        const events = eventOptions[category] || [];
        
        [event1Select, event2Select, event3Select].forEach((select, index) => {
            if(!select) return;
            select.innerHTML = `<option value="">Select Event ${index + 1}</option>`;
            events.forEach(ev => {
                const opt = document.createElement("option");
                opt.value = ev;
                opt.textContent = ev;
                select.appendChild(opt);
            });
            select.disabled = false;
        });
    }

    document.getElementById("registrationForm").addEventListener("submit", function(e) {
        e.preventDefault();

        const name = document.getElementById("studentName").value.trim();
        const studentClass = document.getElementById("studentClass").value;
        const studentDiv = document.getElementById("studentDivision").value;
        const dob = dobInput.value;
        const category = categoryInput.value;
        const gender = document.getElementById("gender").value;
        const group = document.getElementById("group").value;
        
        const ev1 = event1Select.value;
        const ev2 = event2Select.value;
        const ev3 = event3Select.value;

        if (!ev1) {
            alert("Please select mandatory Event 1!");
            return;
        }

        const itemsList = [ev1, ev2, ev3].filter(item => item !== "");

        const newParticipant = {
            id: Date.now(),
            name,
            classDiv: `${studentClass} - ${studentDiv}`,
            dob,
            category,
            gender,
            group,
            items: itemsList.join(", ")
        };

        participants.push(newParticipant);
        try {
            localStorage.setItem("sports_participants", JSON.stringify(participants));
        } catch(e) {}

        alert("Participant Registered Successfully!");
        this.reset();
        categoryInput.value = "";
        [event1Select, event2Select, event3Select].forEach(select => {
            select.innerHTML = '<option value="">Select Event</option>';
            select.disabled = true;
        });

        renderTable();
    });

    function updateEventDropdown() {
        const selectedCat = filterCategory.value;
        filterEvent.innerHTML = '<option value="ALL">All Events</option>';

        let eventsToPopulate = [];
        if (selectedCat === "ALL") {
            Object.values(eventOptions).forEach(list => {
                list.forEach(ev => {
                    if (!eventsToPopulate.includes(ev)) eventsToPopulate.push(ev);
                });
            });
        } else if (eventOptions[selectedCat]) {
            eventsToPopulate = eventOptions[selectedCat];
        }

        eventsToPopulate.forEach(ev => {
            const opt = document.createElement("option");
            opt.value = ev;
            opt.textContent = ev;
            filterEvent.appendChild(opt);
        });
    }

    function getChestNumber(category, index) {
        let prefix = "1";
        if (category === "Sub Junior") prefix = "2";
        if (category === "Junior") prefix = "3";
        return prefix + String(index + 1).padStart(2, '0');
    }

    function getFilteredData() {
        const cat = filterCategory.value;
        const gen = filterGender.value;
        const grp = filterGroup.value;
        const ev = filterEvent.value;

        return participants.filter(p => {
            const matchCat = (cat === "ALL" || p.category === cat);
            const matchGen = (gen === "ALL" || p.gender === gen);
            const matchGrp = (grp === "ALL" || p.group === grp);
            
            let matchEv = true;
            if (ev !== "ALL") {
                const studentItems = p.items ? p.items.split(",").map(i => i.trim()) : [];
                matchEv = studentItems.includes(ev);
            }

            return matchCat && matchGen && matchGrp && matchEv;
        });
    }

    function renderTable() {
        const filteredData = getFilteredData();
        participantTableBody.innerHTML = "";

        const categoryCounters = { "UP Kiddies": 0, "Sub Junior": 0, "Junior": 0 };

        filteredData.forEach(p => {
            const chestNo = getChestNumber(p.category, categoryCounters[p.category] || 0);
            if (categoryCounters[p.category] !== undefined) categoryCounters[p.category]++;

            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td><span class="badge bg-primary fs-6">${chestNo}</span></td>
                <td class="text-start">${p.name}</td>
                <td>${p.classDiv || 'N/A'}</td>
                <td><span class="badge bg-secondary">${p.group || 'N/A'}</span></td>
                <td>${p.category}</td>
                <td>${p.gender}</td>
                <td>${p.items}</td>
                <td><button class="btn btn-danger btn-sm" onclick="window.deleteParticipant(${p.id})">Delete</button></td>
            `;
            participantTableBody.appendChild(tr);
        });
    }

    window.deleteParticipant = function(id) {
        if (confirm("Are you sure you want to delete this participant?")) {
            participants = participants.filter(p => p.id !== id);
            try {
                localStorage.setItem("sports_participants", JSON.stringify(participants));
            } catch(e) {}
            renderTable();
        }
    };

    document.getElementById("toggleAdminBtn").addEventListener("click", function() {
        const adminContent = document.getElementById("adminContent");
        const loginBox = document.getElementById("loginBox");

        if (adminContent.style.display === "none") {
            loginBox.style.display = "block";
            document.getElementById("adminPin").value = "";
        } else {
            adminContent.style.display = "none";
            loginBox.style.display = "none";
            this.textContent = "Unlock Admin";
        }
    });

    document.getElementById("verifyPinBtn").addEventListener("click", function() {
        const inputPin = document.getElementById("adminPin").value;
        if (inputPin === ADMIN_PIN) {
            document.getElementById("loginBox").style.display = "none";
            document.getElementById("adminContent").style.display = "block";
            document.getElementById("toggleAdminBtn").textContent = "Lock Admin";
            updateEventDropdown();
            renderTable();
        } else {
            alert("Incorrect PIN! Access Denied.");
        }
    });
    // --- ഇവിടെയാണ് പുതിയ PDF എക്സ്പോർട്ട് കോഡ് ചേർത്തിരിക്കുന്നത് ---
    document.getElementById("exportPdfBtn").addEventListener("click", function() {
        const filteredData = getFilteredData();

        if (filteredData.length === 0) {
            alert("No participant records available for this selection!");
            return;
        }

        if (!window.jspdf || !window.jspdf.jsPDF) {
            alert("PDF Library not loaded properly. Please check your internet connection.");
            return;
        }

        try {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            const catText = filterCategory.value === "ALL" ? "All Categories" : filterCategory.value;
            const genText = filterGender.value === "ALL" ? "All Genders" : filterGender.value;
            const grpText = filterGroup.value === "ALL" ? "All Groups" : filterGroup.value;
            const evText = filterEvent.value === "ALL" ? "All Events" : filterEvent.value;

            const title = `Sports Meet: ${catText} - ${genText} - ${grpText} (${evText})`;

            doc.setFontSize(13);
            doc.text(title, 14, 15);

            const categoryCounters = { "UP Kiddies": 0, "Sub Junior": 0, "Junior": 0 };

            const pdfData = filteredData.map((p) => {
                const chestNo = getChestNumber(p.category, categoryCounters[p.category] || 0);
                if (categoryCounters[p.category] !== undefined) categoryCounters[p.category]++;

                return [
                    chestNo,
                    p.name,
                    p.classDiv || 'N/A',
                    p.group || 'N/A',
                    p.category,
                    p.gender,
                    p.items
                ];
            });

            doc.autoTable({
                head: [['Chest No', 'Name', 'Class', 'Group', 'Category', 'Gender', 'Events']],
                body: pdfData,
                startY: 22,
                theme: 'grid',
                headStyles: { fillColor: [13, 110, 253] },
                styles: { halign: 'center' },
                columnStyles: { 1: { halign: 'left' } }
            });

            // മൊബൈലിൽ തടസ്സമില്ലാതെ ഡൗൺലോഡ് ആകുന്ന ഭാഗം
            const pdfBlob = doc.output('blob');
            const fileName = `Sports_Meet_${catText}_${genText}.pdf`.replace(/[^a-zA-Z0-9]/g, '_');
            
            const link = document.createElement('a');
            link.href = URL.createObjectURL(pdfBlob);
            link.download = fileName;
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            setTimeout(() => URL.revokeObjectURL(link.href), 1000);

        } catch (error) {
            alert("Error generating PDF: " + error.message);
        }
    });

    filterCategory.addEventListener("change", function() {
        updateEventDropdown();
        renderTable();
    });

    filterGender.addEventListener("change", renderTable);
    filterGroup.addEventListener("change", renderTable);
    filterEvent.addEventListener("change", renderTable);

    updateEventDropdown();
});
</script>

</body>
</html>
